services:
  backend-web:
    environment:
      - CORS_ORIGINS=https://${APP_DOMAIN}
      - BACKEND_WEB_PUBLIC_URL=https://${APP_DOMAIN}
      - FRONTEND_PUBLIC_URL=https://${APP_DOMAIN}
    ports: !override
      - "127.0.0.1:${BACKEND_WEB_PORT:-8089}:8089"

  websocket:
    ports: !override
      - "127.0.0.1:${WEBSOCKET_PORT:-8090}:8090"

  scheduler:
    ports: !override
      - "127.0.0.1:${SCHEDULER_PORT:-8091}:8091"

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-9000}:80"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    container_name: xianyu-caddy
    restart: unless-stopped
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN is required}
      - TZ=Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - xianyu-network
    depends_on:
      backend-web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local